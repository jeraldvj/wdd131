<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Book | Find a Recipe</title>
    <meta name="description" content="Discover delicious recipes, including this simple and delicious Apple Crisp dessert.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="Find delicious recipes and discover your next favorite meal.">
    <meta property="og:url" content="https://yourusername.github.io/wdd131/recipes/">
    <meta property="og:image" content="https://yourusername.github.io/wdd131/recipes/social-preview-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="Find delicious recipes and discover your next favorite meal.">
    <meta name="twitter:image" content="https://yourusername.github.io/wdd131/recipes/social-preview-image.png">

    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="recipes.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/recipe-book.png" alt="Recipe Book logo">
            <h1>RecipeBook</h1>
        </div>
    </header>

    <main>
        
        <section class="search">
            <form action="#">
                <label for="search-input" class="visually-hidden">Find a recipe</label>
                <input type="search" id="search-input" placeholder="Find a recipe">
                <button type="submit" aria-label="Search recipes">
                    <img src="images/search.svg" alt="">
                </button>
            </form>
        </section>
        
        <section class="recipe-container">

            <article class="recipe-card">

                <div class="recipe-image">
                    <img src="images/apple-crisp.jpg" alt="Apple crisp served with a scoop of vanilla ice cream">
                </div>

                <div class="recipe-info">

                    <div class="recipe-category">
                        <span>dessert</span>
                    </div>

                    <h2>Apple Crisp</h2>

                    <div class="rating"
                         role="img"
                         aria-label="Rating: 4 out of 5 stars">

                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star-empty">☆</span>

                    </div>

                    <p class="recipe-description">
                        This apple crisp recipe is a simple yet delicious fall
                        dessert that's great served warm with vanilla ice cream.
                    </p>

                </div>

            </article>

        </section>

    </main>

    
    <footer>

        <a class="attribution"
           href="https://www.flaticon.com/free-icons/recipe"
           title="recipe icons">
            Recipe icons created by Freepik - Flaticon
        </a>

        <div class="social">
            
            <a href="#" aria-label="Instagram">
                <img src="images/instagram_icon.svg" alt="">
            </a>

            <a href="#" aria-label="YouTube">
                <img src="images/youtube_icon.svg" alt="">
            </a>

            <a href="#" aria-label="Pinterest">
                <img src="images/pinterest_icon.svg" alt="">
            </a>

        </div>

    </footer>

</body>
</html>
